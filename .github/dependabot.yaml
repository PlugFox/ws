# Dependency updates (distribution.md F14). Actions are pinned to commit
# SHAs; Dependabot updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: "pub"
    directories: ["/", "/native"]
    schedule:
      interval: "monthly"
      timezone: "UTC"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directories: ["/native/rust", "/server"]
    schedule:
      interval: "monthly"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "UTC"
    groups:
      actions:
        patterns: ["*"]
