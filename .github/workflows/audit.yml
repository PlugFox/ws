name: Audit

# cargo deny on the shipped library and on the test server: advisories
# (RustSec), licences (allow-list in deny.toml), wildcard dependencies and
# unknown sources (distribution.md F8, F14). Weekly as well, because new
# advisories appear without any change here.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: ["master", "develop", "rewrite"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: ["master", "develop", "rewrite"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/deny.toml"

permissions:
  contents: read

jobs:
  deny:
    name: "cargo deny (${{ matrix.crate }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        crate: [native/rust, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🦀 Rust from rust-toolchain.toml
        run: tool/rust_toolchain.sh
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.19.4
      - working-directory: ${{ matrix.crate }}
        run: cargo deny check
