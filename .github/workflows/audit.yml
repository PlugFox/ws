name: Audit

# cargo deny on the shipped library, the test server and the example game
# server (shipped in the plugfox/mobbed image): advisories
# (RustSec), licences (allow-list in deny.toml), wildcard dependencies and
# unknown sources (distribution.md F8, F14). Weekly as well, because new
# advisories appear without any change here.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: ["master", "develop", "rewrite"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: ["master", "develop", "rewrite"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/deny.toml"

permissions:
  contents: read

jobs:
  deny:
    name: "cargo deny (${{ matrix.crate }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        crate: [native/rust, server, example/game/server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🦀 Rust from rust-toolchain.toml
        run: tool/rust_toolchain.sh
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
      - working-directory: ${{ matrix.crate }}
        run: cargo deny check
