name: Checkout

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "develop"
      - "rewrite"
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "support/**"
  pull_request:
    branches:
      - "master"
      - "develop"
      - "rewrite"

concurrency:
  group: checkout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: "Package (format, analyze, publish layout)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🚂 Get latest code
        uses: actions/checkout@v4

      - name: 🎯 Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 👷 Install dependencies
        run: dart pub get

      - name: 🙈 .pubignore covers .gitignore
        run: dart run tool/check_pubignore.dart

      - name: 🔎 Check format
        run: dart format --set-exit-if-changed -o none bin/ lib/ test/ tool/

      - name: 📈 Check analyzer
        run: dart analyze --fatal-infos --fatal-warnings

      - name: 📦 Publish dry run
        run: dart pub publish --dry-run

  test-vm:
    name: "Tests (VM)"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: 🧪 Run tests
        run: dart test --platform vm --reporter expanded

  test-web:
    name: "Tests (Chrome: dart2js, dart2wasm)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: browser-actions/setup-chrome@v1
      - run: dart pub get
      - name: 🧪 dart2js
        run: dart test --platform chrome --reporter expanded
      - name: 🧪 dart2wasm
        run: dart test --platform chrome --compiler dart2wasm --reporter expanded
