name: Checkout

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "develop"
      - "rewrite"
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "support/**"
  pull_request:
    branches:
      - "master"
      - "develop"
      - "rewrite"

concurrency:
  group: checkout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: "Package (format, analyze, publish layout)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🚂 Get latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Set up Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          # Same as mise.toml, so format and lints match local runs.
          sdk: 3.13.7

      - name: 👷 Install dependencies
        run: |
          dart pub get
          dart pub get --directory=native

      - name: 🙈 .pubignore covers .gitignore
        run: dart run tool/check_pubignore.dart

      - name: 🔎 Check format
        run: dart format --set-exit-if-changed -o none bin/ lib/ test/ tool/ native/lib native/test native/hook

      - name: 📈 Check analyzer
        run: |
          dart analyze --fatal-infos --fatal-warnings
          (cd native && dart analyze --fatal-infos --fatal-warnings)

      - name: 📦 Publish dry run
        run: |
          # The example's asset submodule is never published (.pubignore),
          # but pub on Linux reports the uninitialized gitlink as an ignored
          # checked-in file. Drop it from this workspace's index only.
          git rm -q --cached example/assets
          dart pub publish --dry-run

  test-vm:
    name: "Tests (VM)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30
    env:
      # test/support/test_server.dart fails instead of skipping on CI.
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🦀 Rust from rust-toolchain.toml
        shell: bash
        run: '"$GITHUB_WORKSPACE/tool/rust_toolchain.sh"'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            server
            native/rust
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - run: dart pub get
      - name: 🦀 Build the test server and the native library
        shell: bash
        run: |
          (cd server && cargo build --release --locked)
          (cd native/rust && cargo build --release --locked)
          # Native Windows paths: Dart cannot open MSYS paths (/d/a/...).
          root="$(pwd -W 2>/dev/null || pwd)"
          case "$RUNNER_OS" in
            Windows) lib=ws_native.dll; exe=.exe ;;
            macOS) lib=libws_native.dylib; exe= ;;
            *) lib=libws_native.so; exe= ;;
          esac
          echo "WS_TEST_SERVER=$root/server/target/release/ws_bench_server$exe" >> "$GITHUB_ENV"
          echo "WS_NATIVE_LIBRARY=$root/native/rust/target/release/$lib" >> "$GITHUB_ENV"
      - name: 🧪 Run tests (pure Dart, native by path, against the Rust server)
        run: dart test --platform vm --reporter expanded

  test-web:
    name: "Tests (Chrome: dart2js, dart2wasm)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - run: dart pub get
      - name: 🧪 dart2js
        run: dart test --platform chrome --reporter expanded
      - name: 🧪 dart2wasm
        run: dart test --platform chrome --compiler dart2wasm --reporter expanded

  server:
    name: "Test server (fmt, clippy, tests)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🦀 Rust from rust-toolchain.toml
        shell: bash
        run: '"$GITHUB_WORKSPACE/tool/rust_toolchain.sh"'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  min-sdk:
    name: "Lowest bounds (Dart 3.10.0)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.10.0 # environment.sdk lower bound in pubspec.yaml
      - name: 📉 Lowest dependency versions compile
        # Only the library: the lowest test tooling (analyzer 6) does not
        # build on Dart 3.
        run: |
          dart pub downgrade
          dart analyze --fatal-warnings lib bin
      - name: 🧪 Tests on the lowest SDK (pure Dart; server suites skip)
        env:
          CI: "false" # test/support/test_server.dart skips without a server
        run: |
          dart pub upgrade
          dart test --platform vm --reporter expanded
