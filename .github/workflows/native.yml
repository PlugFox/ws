name: Native

on:
  workflow_dispatch:
  push:
    branches: ["master", "develop", "rewrite"]
    paths:
      - "native/**"
      - "lib/**"
      - "test/transport/**"
      - "test/native/**"
      - "test/support/**"
      - "server/**"
      - ".github/workflows/native.yml"
  pull_request:
    branches: ["master", "develop", "rewrite"]
    paths:
      - "native/**"
      - "lib/**"
      - "test/transport/**"
      - "test/native/**"
      - "test/support/**"
      - "server/**"

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: "Rust (fmt, clippy, tests, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  conformance:
    name: "Conformance (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/rust
            server
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: 👷 Install dependencies
        working-directory: native
        run: dart pub get
      - name: 📈 Analyze
        working-directory: native
        run: dart analyze --fatal-infos --fatal-warnings
      - name: 🧪 Shared transport conformance suite (hook builds with cargo)
        working-directory: native
        run: dart test --reporter expanded
      - name: 🧪 Same suites, library loaded by path from package:ws (no hook)
        shell: bash
        run: |
          (cd server && cargo build --release --locked)
          (cd native/rust && cargo build --release --locked)
          case "$RUNNER_OS" in
            Windows) lib=ws_native.dll; exe=.exe ;;
            macOS) lib=libws_native.dylib; exe= ;;
            *) lib=libws_native.so; exe= ;;
          esac
          dart pub get
          WS_TEST_SERVER="$PWD/server/target/release/ws_bench_server$exe" \
          WS_NATIVE_LIBRARY="$PWD/native/rust/target/release/$lib" \
            dart test test/native --reporter expanded
