name: Prebuilt

# Builds libws_native for every target and uploads one artifact, `prebuilt`,
# laid out as native/prebuilt/ (with checksums.json). Run it from a
# workstation with `mise run ci:prebuilt`, which also downloads the result.
# The release workflow reuses it (workflow_call); tag builds skip the cache.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["master", "develop", "rewrite"]
    paths:
      - "native/rust/**"
      - "tool/build_native.sh"
      - ".github/workflows/prebuilt.yml"

concurrency:
  group: prebuilt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    name: "${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x64, os: macos-latest }
          - { target: ios-arm64, os: macos-latest }
          - { target: ios-arm64-sim, os: macos-latest }
          - { target: ios-x64-sim, os: macos-latest }
          - { target: android-arm64, os: ubuntu-latest }
          - { target: android-arm, os: ubuntu-latest }
          - { target: android-x64, os: ubuntu-latest }
          # Oldest available runners: the library links against their glibc
          # (sqlite3 shipped binaries needing glibc 2.38, sqlite3.dart#405).
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
          - { target: windows-x64, os: windows-latest }
          - { target: windows-arm64, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🦀 Rust from rust-toolchain.toml
        shell: bash
        run: '"$GITHUB_WORKSPACE/tool/rust_toolchain.sh"'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # Release binaries are built from a clean state.
        if: github.ref_type != 'tag'
        with:
          workspaces: native/rust
          key: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild (glibc 2.17 floor)
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          pip3 install ziglang==0.17.1
          cargo install cargo-zigbuild --version 0.24.1 --locked
      - name: Build
        shell: bash
        run: tool/build_native.sh ${{ matrix.target }} out
      - name: Verify the binary
        shell: bash
        run: tool/verify_native.sh ${{ matrix.target }} out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lib-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  checksums:
    name: "checksums.json"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lib-*
          path: prebuilt
          merge-multiple: true
      - run: dart pub get
      - run: dart run tool/native_checksums.dart prebuilt
      - run: cat prebuilt/checksums.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt
          path: prebuilt/
          if-no-files-found: error
