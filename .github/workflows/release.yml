name: Release

# One version tag builds, verifies and publishes both packages
# (DECISIONS.md D43, docs/DEVELOPMENT.md "Releasing"):
#
#   check      tag = versions in both pubspecs, native_release.dart and
#              both CHANGELOG headings
#   build      12 targets through prebuilt.yml (verified, no cache)
#   notices    THIRD_PARTY_LICENSES of the Rust crates (cargo about)
#   package    checksums verified, hashes generated into package:ws,
#              ws_native staged, both publish dry runs, release assets
#   release    draft GitHub release with the assets, build provenance
#   publish    (environment `pub.dev`, needs approval) undraft, publish ws
#   publish-native   wait for pub.dev to serve ws, publish ws_native
#
# A push to `rewrite` that touches the release tooling runs everything up
# to and including the dry runs; nothing is released or published.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
    branches: ["rewrite"]
    paths:
      - ".github/workflows/release.yml"
      - "tool/release_check.dart"
      - "tool/native_release.dart"
      - "tool/native_checksums.dart"
      - "tool/stage_native.sh"
      - "tool/third_party_licenses.sh"
      - "native/rust/about.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DART_VERSION: 3.13.7 # mise.toml

jobs:
  check:
    name: "Versions match the tag"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ env.DART_VERSION }}
      - id: version
        name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: dart run tool/release_check.dart "${{ steps.version.outputs.version }}"

  build:
    name: "Build"
    needs: check
    uses: ./.github/workflows/prebuilt.yml

  notices:
    name: "Third-party notices"
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🦀 Rust from rust-toolchain.toml
        run: tool/rust_toolchain.sh
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      - run: tool/third_party_licenses.sh out/THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: out/THIRD_PARTY_LICENSES
          if-no-files-found: error

  package:
    name: "Package (hashes, staging, dry runs, assets)"
    needs: [check, build, notices]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prebuilt
          path: native/prebuilt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - run: dart pub get
      - name: 🔐 Verify checksums.json, generate the hashes into package:ws
        run: |
          dart run tool/native_checksums.dart --check native/prebuilt
          dart run tool/native_release.dart native/prebuilt/checksums.json --commit="$GITHUB_SHA"
          dart format --set-exit-if-changed -o none lib/src/native/native_release.dart
          dart test test/native/install_test.dart test/tool
      - name: 📦 Stage ws_native (git-tracked files, libraries, notices)
        run: |
          tool/stage_native.sh "$RUNNER_TEMP/ws_native" "$VERSION" \
            --release notices/THIRD_PARTY_LICENSES
          echo "crate notices in LICENSE: $(grep -c '^- ' "$RUNNER_TEMP/ws_native/LICENSE")"
      - name: 🧪 Publish dry runs
        run: |
          # The working tree must be clean for pub: commit the generated
          # hashes locally (the publish job does the same), and drop the
          # uninitialized asset submodule from this workspace's index.
          git rm -q --cached example/assets
          git -c user.name=release -c user.email=release@localhost \
            commit -q -am "Release $VERSION: native library hashes"
          dart pub publish --dry-run
          cp -R "$RUNNER_TEMP/ws_native" "$RUNNER_TEMP/ws_native_dry"
          printf 'dependency_overrides:\n  ws:\n    path: %s\n' "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/ws_native_dry/pubspec_overrides.yaml"
          (cd "$RUNNER_TEMP/ws_native_dry" && dart pub get && dart pub publish --dry-run)
      - name: 🗂️ Release assets
        run: |
          mkdir assets
          for dir in native/prebuilt/*/; do
            target="$(basename "$dir")"
            for file in "$dir"*; do
              cp "$file" "assets/$target-$(basename "$file")"
            done
          done
          cp native/prebuilt/checksums.json notices/THIRD_PARTY_LICENSES \
            lib/src/native/native_release.dart assets/
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > release_notes.md
          ls -l assets
          [[ "$(find assets -name '*ws_native*' | wc -l)" == 12 ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            assets/
            release_notes.md
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ws_native
          path: ${{ runner.temp }}/ws_native/
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: "Draft GitHub release"
    if: github.ref_type == 'tag'
    needs: [check, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*ws_native*
      - name: Draft release
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" assets/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$VERSION" \
            --notes-file release_notes.md "${prerelease[@]}"

  publish:
    name: "Publish ws"
    needs: [check, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewers on this environment gate everything public: the
    # draft can be inspected before approving (docs/DEVELOPMENT.md).
    environment: pub.dev
    permissions:
      contents: write
      id-token: write # pub.dev OIDC
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Hashes into package:ws
        run: |
          cp "$RUNNER_TEMP/release/assets/native_release.dart" lib/src/native/
          git rm -q --cached example/assets
          git -c user.name=release -c user.email=release@localhost \
            commit -q -am "Release $VERSION: native library hashes"
          dart pub get
          dart test test/native/install_test.dart
      # The libraries are public before ws points at them.
      - name: Publish the GitHub release
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
      - run: dart pub publish --force

  publish-native:
    name: "Publish ws_native"
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pub.dev
    permissions:
      id-token: write # pub.dev OIDC
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ws_native
          path: ws_native
      - name: Wait until pub.dev serves ws ${{ env.VERSION }}
        run: |
          for _ in $(seq 1 60); do
            curl -fsS "https://pub.dev/api/packages/ws/versions/$VERSION" >/dev/null && exit 0
            sleep 10
          done
          echo "pub.dev does not serve ws $VERSION after 10 minutes" >&2
          exit 1
      - working-directory: ws_native
        run: |
          dart pub get
          dart pub publish --force
