[package]
name = "ws_bench_native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
futures-util = "0.3"
simd-json = "0.19.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
