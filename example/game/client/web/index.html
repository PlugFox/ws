<style>
  html, body { margin: 0; height: 100%; color: #eee; font: 16px 'Alegreya Sans', system-ui, sans-serif;
               background: #9fc3e6; }
  /* The page is an app, not a document: no pull-to-refresh or rubber band,
     no pinch / double-tap zoom, no selection, callout or image drag outside
     text fields (lib/src/page_guard.dart does what CSS cannot). Scrolling
     lists in windows set their own touch-action / overflow. */
  html, body { overflow: hidden; overscroll-behavior: none; touch-action: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
               -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  img, canvas { -webkit-user-drag: none; }
  input, textarea, select, [contenteditable]:not([contenteditable="false"]) {
    -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; touch-action: manipulation; }
  #stage { position: fixed; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
<script src="/assets/engine.bundle.js"></script>

<script>
  // Installable app (PWA): the service worker (sw.js) only keeps the shell
  // for a flaky network; the game itself is online.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
