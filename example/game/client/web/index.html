<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ws game</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d111a; color: #eee; font: 14px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  .login { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 300px;
           background: #1b2130; border: 1px solid #3d4a66; border-radius: 8px; padding: 20px; z-index: 5; }
  .login h1 { margin: 0 0 12px; font-size: 18px; }
  .login input, .login select, .login button { display: block; box-sizing: border-box; width: 100%; margin: 6px 0;
           padding: 8px; border-radius: 6px; border: 1px solid #3d4a66; background: #10141f; color: inherit; font: inherit; }
  .login button { background: #2f6fd6; border-color: #2f6fd6; cursor: pointer; }
  .login button.secondary { background: #28324a; border-color: #3d4a66; }
  .login .error { color: #ff8a8a; min-height: 1em; margin-top: 6px; }
</style>
<script src="/assets/engine.bundle.js"></script>
<script defer src="main.dart.js"></script>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
</body>
</html>
