name: ws_flutter
description: >
  Flutter app lifecycle for the ws WebSocket client: suspend in the
  background, check the connection and reconnect at once on resume and when
  the network changes.
version: 2.0.0-dev.1
repository: https://github.com/plugfox/ws/tree/master/flutter
issue_tracker: https://github.com/plugfox/ws/issues
# Not published: the name is taken on pub.dev, and the class is a README
# recipe (docs/DECISIONS.md D58). This package keeps it tested.
publish_to: none

topics:
  - websocket
  - lifecycle
  - reconnect

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  ws:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
