name: ws_native
description: >
  Native (Rust) transport for the ws WebSocket client: TLS, framing and JSON
  parsing off the Dart thread. Install it with WsNative.install().
version: 2.0.0-dev.1
repository: https://github.com/plugfox/ws/tree/master/native
issue_tracker: https://github.com/plugfox/ws/issues
publish_to: none # until the first release

topics:
  - websocket
  - ffi
  - rust
  - native-assets

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.6
  hooks: ^2.2.0
  meta: ^1.16.0
  ws:
    path: ..

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
