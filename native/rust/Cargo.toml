[package]
name = "ws_native"
version = "0.1.0"
edition = "2024"
description = "Native WebSocket transport for the Dart package ws (FFI)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
simd-json = "0.19.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.30"
webpki-roots = "1.0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwinding stays on: every FFI entry point catches panics (DECISIONS.md D18).
panic = "unwind"
strip = true
