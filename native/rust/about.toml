# cargo about generate: THIRD_PARTY_LICENSES for the shipped library
# (distribution.md F8). Same allow-list as deny.toml.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
workarounds = ["ring"]
