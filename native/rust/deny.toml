# cargo deny check: licences, advisories, duplicate and wildcard
# dependencies, sources (distribution.md F8, F14). The library is shipped
# as a binary to every user, so only permissive licences are allowed, and
# their notices go into THIRD_PARTY_LICENSES (about.toml).

[graph]
all-features = false

[advisories]
# Unmaintained crates are reported for direct dependencies only.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "warn"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
