# cargo deny check for the test server (not shipped): advisories and
# sources as in native/rust/deny.toml, permissive licences only.

[graph]
all-features = false

[advisories]
# Unmaintained crates are reported for direct dependencies only.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "warn"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-3-Clause",
  "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
